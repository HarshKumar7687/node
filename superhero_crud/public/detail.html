
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Profile | Super Heroes</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-[#080b14] text-white lg:overflow-hidden">
    <main class="max-w-7xl mx-auto px-6 py-10 md:py-16">
        <div id="heroDetails">
            <div class="text-center py-32">
                <div class="w-12 h-12 border-4 border-purple-500 border-t-transparent rounded-full animate-spin mx-auto mb-5"></div>
                <p class="text-gray-400 tracking-widest uppercase text-sm">Entering the universe...</p>
            </div>
        </div>
    </main>

    <script>
        const heroDetails = document.getElementById("heroDetails");
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        async function getHeroDetails() {
            try {
                if (!id) {
                    throw new Error("No hero ID provided.");
                }

                const response = await fetch(`http://localhost:3000/api/heroes/${id}`);

                if (!response.ok) {
                    throw new Error("Hero not found.");
                }

                const hero = await response.json();

                document.title = `${hero.name} | HeroVerse`;

                heroDetails.innerHTML = `
                    <section class="relative overflow-hidden rounded-3xl border border-white/10 bg-[#101522] shadow-2xl shadow-purple-950/20">

                        <div class="absolute -top-32 -right-24 w-96 h-96 bg-purple-600/10 blur-[100px] rounded-full pointer-events-none"></div>
                        <div class="absolute -bottom-32 -left-24 w-80 h-80 bg-fuchsia-600/10 blur-[100px] rounded-full pointer-events-none"></div>

                        <div class="relative grid grid-cols-1 lg:grid-cols-2">

                            <div class="relative min-h-[400px] lg:min-h-[620px] bg-gradient-to-br from-[#1d2335] to-[#0b0e18] overflow-hidden">
                                <div class="absolute inset-0 bg-gradient-to-t from-[#101522] via-transparent to-black/10 z-10"></div>

                                <div class="absolute top-6 left-6 z-20">
                                    <span class="border border-white/20 bg-black/30 backdrop-blur-md text-gray-200 text-xs tracking-[3px] uppercase px-4 py-2 rounded-full">
                                        Subject #${String(hero.id).padStart(3, "0")}
                                    </span>
                                </div>

                                <img
                                    src="${hero.imageUrl}"
                                    alt="${hero.name}"
                                    onerror="this.onerror=null;this.src='https://placehold.co/700x900/151a2a/e9d5ff?text=Hero+Image'"
                                    class="absolute inset-0 w-full h-full object-cover object-top"
                                >

                                <div class="absolute bottom-7 left-7 right-7 z-20">
                                    <p class="text-xs uppercase tracking-[5px] text-fuchsia-300 mb-2">Meet the legend</p>
                                    <h2 class="text-4xl sm:text-5xl font-black uppercase tracking-tight drop-shadow-lg">
                                        ${hero.name}
                                    </h2>
                                </div>
                            </div>

                            <div class="relative p-7 sm:p-10 lg:p-12 flex flex-col justify-center">

                                <div class="flex flex-wrap items-center gap-3 mb-8">
                                    <span class="inline-flex items-center gap-2 rounded-full bg-purple-500/10 border border-purple-400/20 text-purple-300 text-xs font-semibold px-4 py-2">
                                        <span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
                                        ${hero.team}
                                    </span>

                                    <span class="inline-flex items-center gap-2 rounded-full ${
                                        hero.isActive
                                        ? "bg-emerald-500/10 border border-emerald-400/20 text-emerald-300"
                                        : "bg-red-500/10 border border-red-400/20 text-red-300"
                                    } text-xs font-semibold px-4 py-2">
                                        <span class="w-1.5 h-1.5 rounded-full ${
                                            hero.isActive ? "bg-emerald-400" : "bg-red-400"
                                        }"></span>
                                        ${hero.isActive ? "Currently Active" : "Inactive"}
                                    </span>
                                </div>

                                <p class="text-xs font-bold uppercase tracking-[4px] text-fuchsia-400 mb-3">
                                    Classified Hero Profile
                                </p>

                                <h1 class="text-4xl sm:text-5xl font-black tracking-tight leading-tight mb-3">
                                    ${hero.name}
                                </h1>

                                <p class="text-lg text-gray-400 mb-8">
                                    Also known as <span class="text-gray-200 font-medium">${hero.realName}</span>
                                </p>

                                <div class="h-px bg-gradient-to-r from-fuchsia-500/60 via-purple-500/30 to-transparent mb-8"></div>

                                <h3 class="text-xs uppercase tracking-[3px] text-gray-500 font-bold mb-5">
                                    Hero Intelligence
                                </h3>

                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                                    <div class="rounded-2xl border border-white/[0.07] bg-white/[0.03] p-5 hover:border-purple-500/40 transition">
                                        <p class="text-xs text-gray-500 mb-3 flex items-center gap-2">
                                            <span class="text-xl">⚡</span> SUPERPOWER
                                        </p>
                                        <p class="text-lg font-bold text-purple-300">${hero.power}</p>
                                    </div>

                                    <div class="rounded-2xl border border-white/[0.07] bg-white/[0.03] p-5 hover:border-purple-500/40 transition">
                                        <p class="text-xs text-gray-500 mb-3 flex items-center gap-2">
                                            <span class="text-xl">◷</span> AGE
                                        </p>
                                        <p class="text-lg font-bold">${Number(hero.age).toLocaleString()} <span class="text-sm text-gray-500 font-normal">years</span></p>
                                    </div>

                                    <div class="rounded-2xl border border-white/[0.07] bg-white/[0.03] p-5 hover:border-purple-500/40 transition">
                                        <p class="text-xs text-gray-500 mb-3 flex items-center gap-2">
                                            <span class="text-xl">⌖</span> BASE LOCATION
                                        </p>
                                        <p class="text-lg font-bold">${hero.city}</p>
                                    </div>

                                    <div class="rounded-2xl border border-white/[0.07] bg-white/[0.03] p-5 hover:border-purple-500/40 transition">
                                        <p class="text-xs text-gray-500 mb-3 flex items-center gap-2">
                                            <span class="text-xl">✦</span> AFFILIATION
                                        </p>
                                        <p class="text-lg font-bold">${hero.team}</p>
                                    </div>
                                </div>

                                <div class="mt-8 p-4 rounded-xl border border-white/[0.07] bg-black/20 flex items-center justify-between gap-4">
                                    <div>
                                        <p class="text-xs text-gray-500 uppercase tracking-widest mb-1">Database Record</p>
                                        <p class="text-sm text-gray-300">Hero identification verified</p>
                                    </div>
                                    <span class="text-xs font-mono text-fuchsia-300 border border-fuchsia-400/20 bg-fuchsia-400/5 rounded-lg px-3 py-2">
                                        HV-${String(hero.id).padStart(4, "0")}
                                    </span>
                                </div>

                                <a href="/" class="group mt-8 w-full inline-flex items-center justify-center gap-3 rounded-xl bg-gradient-to-r from-purple-600 to-fuchsia-600 hover:from-purple-500 hover:to-fuchsia-500 px-6 py-4 font-bold text-white shadow-lg shadow-purple-900/30 transition duration-300">
                                    <span class="transition-transform group-hover:-translate-x-1">←</span>
                                    Explore All Heroes
                                </a>
                            </div>
                        </div>
                    </section>
                `;

            } catch (error) {
                heroDetails.innerHTML = `
                    <div class="rounded-3xl border border-red-500/20 bg-[#101522] p-10 sm:p-16 text-center">
                        <div class="text-5xl mb-5">⚠</div>
                        <h2 class="text-3xl font-black mb-3">Hero Not Found</h2>
                        <p class="text-gray-400 mb-8">${error.message}</p>
                        <a href="/" class="inline-flex items-center gap-2 rounded-xl bg-purple-600 hover:bg-purple-500 px-6 py-3 font-semibold transition">
                            ← Return to Heroes
                        </a>
                    </div>
                `;
            }
        }

        getHeroDetails();
    </script>

</body>
</html>
