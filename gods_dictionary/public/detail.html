<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Profile | Divine Darshan</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        body {
            background: radial-gradient(ellipse at top, #3b1d0b 0%, #170b08 45%, #090605 100%);
        }

        .gold-text {
            background: linear-gradient(90deg, #fef3c7, #fbbf24, #f97316, #fef3c7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .divine-card {
            background: linear-gradient(145deg, rgba(69, 35, 14, 0.95), rgba(25, 13, 8, 0.98));
            border: 1px solid rgba(251, 191, 36, 0.25);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
        }

        .gold-button {
            background: linear-gradient(135deg, #f59e0b, #c2410c);
        }

        .gold-button:hover {
            background: linear-gradient(135deg, #fbbf24, #ea580c);
        }

        .detail-box {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(251, 191, 36, 0.12);
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .detail-box:hover {
            border-color: rgba(251, 191, 36, 0.35);
            background: rgba(255, 255, 255, 0.04);
        }

        .mantra-button {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #291509;
            transition: all 0.25s ease;
        }

        .mantra-button:hover {
            background: linear-gradient(135deg, #fde68a, #f59e0b);
            transform: scale(1.05);
        }

        .mantra-button.playing {
            background: linear-gradient(135deg, #f97316, #c2410c);
            color: white;
        }

        @media (min-width: 1024px) {
            .profile-image {
                min-height: 690px;
            }
        }

        @media (min-width: 1280px) {
            .profile-image {
                min-height: 740px;
            }
        }
    </style>
</head>

<body class="min-h-screen text-amber-50">
    <main class="max-w-7xl mx-auto px-5 py-6 sm:px-6 sm:py-8">
        <div id="godDetails">
            <div class="text-center py-24">
                <div class="w-11 h-11 border-4 border-amber-400 border-t-transparent rounded-full animate-spin mx-auto mb-5"></div>
                <p class="text-amber-200/60 tracking-widest uppercase text-sm">Entering the divine realm...</p>
            </div>
        </div>
    </main>

    <script>
        const godDetails = document.getElementById("godDetails");
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        let currentMantra = "";
        let isChanting = false;

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }

        function toggleChanting() {
            if (!currentMantra.trim()) {
                alert("No favourite mantra is available for this deity.");
                return;
            }

            if (!("speechSynthesis" in window)) {
                alert("Sorry, your browser does not support voice chanting.");
                return;
            }

            if (isChanting) {
                window.speechSynthesis.cancel();
                isChanting = false;
                updateMantraButton(false);
                return;
            }

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(currentMantra);
            utterance.lang = /[\u0900-\u097F]/.test(currentMantra) ? "hi-IN" : "en-IN";
            utterance.rate = 0.75;
            utterance.pitch = 0.9;
            utterance.volume = 1;

            utterance.onstart = () => {
                isChanting = true;
                updateMantraButton(true);
            };

            utterance.onend = () => {
                isChanting = false;
                updateMantraButton(false);
            };

            utterance.onerror = () => {
                isChanting = false;
                updateMantraButton(false);
            };

            window.speechSynthesis.speak(utterance);
        }

        function updateMantraButton(playing) {
            const button = document.getElementById("mantraButton");
            const status = document.getElementById("mantraStatus");

            if (!button) return;

            button.classList.toggle("playing", playing);

            button.innerHTML = playing
                ? `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>`
                : `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`;

            button.setAttribute("aria-label", playing ? "Stop chanting" : "Chant mantra");
            button.title = playing ? "Stop chanting" : "Listen to mantra";

            if (status) {
                status.textContent = playing ? "Chanting mantra..." : "Click the speaker to listen";
            }
        }

        async function getGodDetails() {
            try {
                if (!id) {
                    throw new Error("No deity ID provided.");
                }

                const response = await fetch(`/api/gods/${encodeURIComponent(id)}`);

                if (!response.ok) {
                    throw new Error("Deity not found.");
                }

                const god = await response.json();

                if (!god || !god.name) {
                    throw new Error("Deity not found.");
                }

                document.title = `${god.name} | Divine Darshan`;

                const name = escapeHTML(god.name);
                const divineName = escapeHTML(god.divineName);
                const domain = escapeHTML(god.domain);
                const weapon = escapeHTML(god.weapon);
                const mount = escapeHTML(god.mount);
                const abode = escapeHTML(god.abode);
                const consort = escapeHTML(god.consort);
                const symbol = escapeHTML(god.symbol);
                const festival = escapeHTML(god.festival);
                const imageUrl = escapeHTML(god.imageUrl);
                const mantra = escapeHTML(god.favouriteMantra);
                const majorDeity = god.isMajorDeity === true;

                currentMantra = String(god.favouriteMantra ?? "");

                const classification = majorDeity
                    ? `<span class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-500 text-amber-950 border border-yellow-200 text-sm font-bold px-4 py-2 shadow-md">✦ Major Deity</span>`
                    : `<span class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-gray-100 via-slate-200 to-gray-300 text-slate-700 border border-white/70 text-sm font-bold px-4 py-2">✧ Sacred Deity</span>`;

                godDetails.innerHTML = `
                    <section class="relative overflow-hidden rounded-3xl divine-card">
                        <div class="absolute -top-32 -right-24 w-96 h-96 bg-amber-500/10 blur-[100px] rounded-full pointer-events-none"></div>
                        <div class="absolute -bottom-32 -left-24 w-80 h-80 bg-orange-600/10 blur-[100px] rounded-full pointer-events-none"></div>

                        <div class="relative grid grid-cols-1 lg:grid-cols-2">

                            <div class="profile-image relative h-[390px] sm:h-[480px] lg:h-auto bg-gradient-to-br from-[#3b1d0b] to-[#0b0805] overflow-hidden">
                                <div class="absolute inset-0 bg-gradient-to-t from-[#190d08]/90 via-transparent to-black/10 z-10 pointer-events-none"></div>

                                <div class="absolute top-6 left-6 z-20">
                                    <span class="border border-amber-400/30 bg-black/40 backdrop-blur-md text-amber-200 text-xs tracking-[2px] uppercase px-4 py-2 rounded-full">
                                        Divine Record #${String(god.id).padStart(3, "0")}
                                    </span>
                                </div>

                                <img
                                    src="${imageUrl}"
                                    alt="${name}"
                                    onerror="this.onerror=null;this.src='https://placehold.co/700x900/291509/fbbf24?text=Divine+Darshan'"
                                    class="absolute inset-0 w-full h-full object-cover object-top"
                                >

                                <div class="absolute bottom-7 left-7 right-7 z-20">
                                    <p class="text-xs uppercase tracking-[4px] text-amber-300 mb-3">A Presence Beyond Time</p>
                                    <h2 class="text-4xl sm:text-5xl font-black tracking-tight drop-shadow-lg text-white">${name}</h2>
                                    <p class="text-amber-100/80 mt-2 text-lg">${divineName || "Divine Presence"}</p>
                                </div>
                            </div>

                            <div class="relative p-6 sm:p-8 lg:p-8 xl:p-9 flex flex-col justify-center">

                                <div class="flex flex-wrap items-center gap-3 mb-5">
                                    ${classification}
                                </div>

                                <p class="text-xs font-bold uppercase tracking-[3px] text-amber-500 mb-2">
                                    Sacred Deity Profile
                                </p>

                                <h1 class="text-4xl sm:text-5xl font-black tracking-tight leading-tight mb-2 gold-text">
                                    ${name}
                                </h1>

                                <p class="text-lg text-amber-100/60 mb-5">
                                    ${divineName || "A revered divine presence"}
                                </p>

                                <div class="h-px bg-gradient-to-r from-amber-500/70 via-orange-500/30 to-transparent mb-5"></div>

                                <h3 class="text-xs uppercase tracking-[3px] text-amber-100/40 font-bold mb-4">
                                    Divine Attributes
                                </h3>

                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

                                    <div class="detail-box rounded-xl p-4">
                                        <p class="text-xs text-amber-100/45 mb-2 flex items-center gap-2">
                                            <span class="text-lg">✦</span> DIVINE DOMAIN
                                        </p>
                                        <p class="text-base font-bold text-amber-300 break-words">${domain || "Not specified"}</p>
                                    </div>

                                    <div class="detail-box rounded-xl p-4">
                                        <p class="text-xs text-amber-100/45 mb-2 flex items-center gap-2">
                                            <span class="text-lg">⚔</span> SACRED WEAPON
                                        </p>
                                        <p class="text-base font-bold text-amber-200 break-words">${weapon || "Not specified"}</p>
                                    </div>

                                    <div class="detail-box rounded-xl p-4">
                                        <p class="text-xs text-amber-100/45 mb-2 flex items-center gap-2">
                                            <span class="text-lg">🐚</span> DIVINE MOUNT
                                        </p>
                                        <p class="text-base font-bold break-words">${mount || "Not specified"}</p>
                                    </div>

                                    <div class="detail-box rounded-xl p-4">
                                        <p class="text-xs text-amber-100/45 mb-2 flex items-center gap-2">
                                            <span class="text-lg">⌂</span> SACRED ABODE
                                        </p>
                                        <p class="text-base font-bold break-words">${abode || "Not specified"}</p>
                                    </div>

                                    <div class="detail-box rounded-xl p-4">
                                        <p class="text-xs text-amber-100/45 mb-2 flex items-center gap-2">
                                            <span class="text-lg">♡</span> DIVINE CONSORT
                                        </p>
                                        <p class="text-base font-bold break-words">${consort || "Not specified"}</p>
                                    </div>

                                    <div class="detail-box rounded-xl p-4">
                                        <p class="text-xs text-amber-100/45 mb-2 flex items-center gap-2">
                                            <span class="text-lg">❖</span> SACRED SYMBOL
                                        </p>
                                        <p class="text-base font-bold text-amber-200 break-words">${symbol || "Not specified"}</p>
                                    </div>

                                    <div class="detail-box rounded-xl p-4 sm:col-span-2">
                                        <p class="text-xs text-amber-100/45 mb-2 flex items-center gap-2">
                                            <span class="text-lg">🪔</span> ASSOCIATED FESTIVAL
                                        </p>
                                        <p class="text-base font-bold text-amber-300 break-words">${festival || "Not specified"}</p>
                                    </div>

                                    <div class="detail-box rounded-xl p-4 sm:col-span-2">
                                        <div class="flex items-center justify-between gap-4">
                                            <div class="flex-1 min-w-0">
                                                <p class="text-xs text-amber-100/45 mb-2 flex items-center gap-2">
                                                    <span class="text-lg">ॐ</span> FAVOURITE MANTRA
                                                </p>
                                                <p class="text-lg sm:text-xl font-bold text-amber-300 leading-relaxed break-words">${mantra || "Mantra not specified"}</p>
                                                <p id="mantraStatus" class="text-xs text-amber-100/40 mt-2">
                                                    ${mantra ? "Click the speaker to listen" : "No mantra available"}
                                                </p>
                                            </div>

                                            <button
                                                id="mantraButton"
                                                onclick="toggleChanting()"
                                                ${mantra ? "" : "disabled"}
                                                aria-label="Chant mantra"
                                                title="${mantra ? "Listen to mantra" : "No mantra available"}"
                                                class="mantra-button shrink-0 w-12 h-12 rounded-full flex items-center justify-center shadow-lg shadow-amber-950/40 disabled:opacity-30 disabled:cursor-not-allowed"
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                                                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                                                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                                                </svg>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <a href="/" class="group mt-5 w-full inline-flex items-center justify-center gap-3 rounded-xl gold-button px-6 py-3.5 font-bold text-white shadow-lg shadow-orange-950/30 transition duration-300">
                                    <span class="transition-transform group-hover:-translate-x-1">←</span>
                                    Explore Divine Collection
                                </a>
                            </div>
                        </div>
                    </section>
                `;

            } catch (error) {
                godDetails.innerHTML = `
                    <div class="rounded-3xl divine-card p-10 sm:p-14 text-center">
                        <div class="text-5xl mb-5">🪔</div>
                        <h2 class="text-3xl font-black mb-3 gold-text">Divine Record Not Found</h2>
                        <p class="text-amber-100/60 mb-7">${escapeHTML(error.message)}</p>
                        <a href="/" class="inline-flex items-center gap-2 rounded-xl gold-button px-6 py-3 font-semibold text-white transition">
                            ← Return to Divine Collection
                        </a>
                    </div>
                `;
            }
        }

        window.addEventListener("beforeunload", () => {
            if ("speechSynthesis" in window) {
                window.speechSynthesis.cancel();
            }
        });

        getGodDetails();
    </script>
</body>
</html>
